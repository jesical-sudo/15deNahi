<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subí tu foto — Muro de los 15 de Nahiara</title>
<meta name="description" content="Subí tu foto al muro en vivo de los 15 de Nahiara">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: flex; justify-content: center; }
  .upload-wrap { width: 100%; max-width: 480px; padding: var(--space-5) var(--space-4) 60px; position: relative; z-index: 1; }
  .upload-header { text-align: center; margin: var(--space-4) 0 var(--space-6); }
  .upload-header .brand-name { font-size: clamp(1.9rem, 8vw, 2.6rem); }
  .upload-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-5); box-shadow: var(--shadow-card); }
  .photo-picker {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2);
    border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: var(--space-6) var(--space-4);
    cursor: pointer; text-align: center; color: var(--ink-muted); margin-bottom: var(--space-5); position: relative; overflow: hidden;
    min-height: 180px;
  }
  .photo-picker.has-image { border-style: solid; padding: 0; }
  .photo-picker img { width: 100%; max-height: 320px; object-fit: cover; display: block; border-radius: 14px; }
  .photo-picker .icon { font-size: 2.2rem; }
  .photo-picker input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .field { margin-bottom: var(--space-4); }
  .field label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin-bottom: var(--space-2); }
  .field input[type="text"], .field textarea { width: 100%; padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--bg-2); color: var(--ink); font-family: inherit; font-size: 1rem; }
  .field textarea { min-height: 76px; resize: vertical; }
  .field .count { text-align: right; font-size: 0.72rem; color: var(--ink-faint); margin-top: 4px; }
  .submit-btn {
    width: 100%; padding: var(--space-4); border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(120deg, var(--rose-deep), var(--rose)); color: var(--black); font-weight: 800; font-size: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn:disabled { opacity: .55; cursor: not-allowed; }
  .status-msg { text-align: center; font-size: 0.85rem; color: var(--bad); min-height: 1.3em; margin-top: var(--space-3); }
  .success-screen { text-align: center; padding: var(--space-7) var(--space-4); }
  .success-screen .icon { font-size: 3rem; }
  .success-screen h2 { margin: var(--space-4) 0 var(--space-2); font-size: 1.8rem; }
  .success-screen p { color: var(--ink-muted); margin-bottom: var(--space-5); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(8,7,10,.35); border-top-color: var(--black); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { text-align: center; font-size: 0.78rem; color: var(--ink-faint); margin-top: var(--space-4); }
</style>
</head>
<body>
<div class="sparkle-field" aria-hidden="true"></div>

<div class="upload-wrap">
  <div class="upload-header">
    <span class="eyebrow" id="hashtagLabel">#15deNahi</span>
    <h1 class="brand-name" id="brandName">Nahiara</h1>
    <p class="brand-tagline" id="brandTagline">Sumá tu foto al muro</p>
  </div>

  <div class="upload-card" id="uploadCard">
    <form id="uploadForm" novalidate>
      <label class="photo-picker" id="photoPicker" for="photoInput">
        <span class="icon">📷</span>
        <span>Tocá para elegir o sacar una foto</span>
        <input type="file" id="photoInput" name="foto" accept="image/*" capture="environment" required>
      </label>

      <div class="field">
        <label for="nameInput">Tu nombre</label>
        <input type="text" id="nameInput" name="nombre" maxlength="40" placeholder="¿Cómo te llamás?" required>
      </div>

      <div class="field">
        <label for="msgInput">Mensaje para Nahiara (opcional)</label>
        <textarea id="msgInput" name="mensaje" maxlength="140" placeholder="Escribí un deseo o un recuerdo de la noche…"></textarea>
        <div class="count"><span id="msgCount">0</span>/140</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Subir al muro ✨</button>
      <p class="status-msg" id="statusMsg" role="alert"></p>
    </form>
  </div>

  <p class="hint">Tu foto aparece en la pantalla del salón en segundos. Evitá subir fotos de otras personas sin su permiso.</p>
</div>

<script src="/js/feed-adapter.js"></script>
<script src="/js/subir.js"></script>
</body>
</html>
